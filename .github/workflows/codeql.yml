name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analyze:
    name: Analyze Go
    runs-on: ubuntu-latest
    permissions:
      # Uploads the CodeQL SARIF results to code scanning.
      security-events: write
      # Checks out the source this analysis compiles and scans.
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: go

      - name: Build
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:go"

  # Second CodeQL language: `actions` scans the workflow files themselves for
  # script injection, unpinned/mutable action refs and over-broad permissions.
  # It is a distinct analysis from `go` -- the Go job says nothing about the 10
  # workflow files in this repo.
  #
  # Two of those (pr-labels.yml, pr-milestone.yml) run on `pull_request_target`,
  # which grants a write-capable token in the base-repo context. That trigger is
  # not by itself an execution risk: neither workflow checks out PR head code,
  # and both only call actions/github-script against the API. The exposure would
  # arise from checking out or executing untrusted head code while holding that
  # token, or from interpolating attacker-controlled PR fields into a script.
  # This analysis is what would catch either if one were introduced later.
  #
  # No conditional skip: `build-mode: none` means there is nothing to compile,
  # so the job costs roughly a minute and always running it keeps the required
  # status check honest -- a check that is sometimes absent cannot be required.
  analyze-actions:
    name: Analyze Actions
    runs-on: ubuntu-latest
    permissions:
      # Uploads the CodeQL SARIF results to code scanning.
      security-events: write
      # Checks out the workflow files this analysis reads.
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: actions
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:actions"
