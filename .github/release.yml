# Categorization for GitHub's auto-generated release notes. Categories are
# matched top-down against a merged PR's labels, first match wins, so the
# catch-all "*" must stay last or it would swallow everything above it.
changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - wontfix
      - question
  categories:
    - title: Features
      labels:
        - enhancement
    - title: Bug fixes
      labels:
        - bug
    - title: Performance
      labels:
        - performance
    - title: Security
      labels:
        - security
    - title: Documentation
      labels:
        - documentation
    - title: CI / Build
      labels:
        - ci
    - title: Dependencies
      labels:
        - dependencies
    - title: Refactoring
      labels:
        - technical-debt
        - chore
    - title: Other Changes
      labels:
        - "*"
